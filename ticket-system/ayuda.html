    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />

  </head>
  <body>
    <!--
      Filtro SVG reutilizable para bordes "papel rasgado". Igual que en
      entradas.html: vive aquí (no en React) para evitar IDs duplicados por el
      doble render de StrictMode y para estar disponible antes de montar la app.
      El tema (theme.css) lo referencia como url(#tk-rough) en capas decorativas
      (p. ej. el parche del título); sin él, esas capas no se renderizarían.
    -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="tk-rough">
        <feTurbulence type="fractalNoise" baseFrequency="0.014 0.018" numOctaves="3" seed="7" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/ayuda/main.tsx"></script>
  </body>
</html>
