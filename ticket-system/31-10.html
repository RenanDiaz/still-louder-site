<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>31.10.2026 · Still Louder</title>
    <!--
      Lo mínimo, a propósito: la fecha y la banda. Nada de cómo se llama la
      noche, ni de que aquí se venderán las entradas — mientras menos se revele,
      más misterio. En la página se ve tenue (teaser.css), pero acá va en claro
      porque el preview del enlace y los buscadores leen este texto tal cual.
    -->
    <meta name="description" content="Still Louder — 31 de octubre de 2026." />
    <!--
      Sin paleta propia todavía: el teaser es deliberadamente monocromo, así que
      el theme-color es el negro del fondo y no compromete el color del evento.
    -->
    <meta name="theme-color" content="#050506" />
    <link rel="canonical" href="https://entradas.stilllouder.space/31-10" />

    <!-- Open Graph (WhatsApp, Facebook, Instagram, Telegram) -->
    <!--
      SIN og:image a propósito: el único arte que existe es el flyer de WWWY3 y
      usarlo aquí anunciaría el evento equivocado. Al haber diseño, agregar la
      imagen (1200x630) junto a og:image:width/height y twitter:image.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Still Louder" />
    <meta property="og:locale" content="es_PA" />
    <meta property="og:url" content="https://entradas.stilllouder.space/31-10" />
    <meta property="og:title" content="31.10.2026 · Still Louder" />
    <meta property="og:description" content="31 de octubre de 2026." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="31.10.2026 · Still Louder" />
    <meta name="twitter:description" content="31 de octubre de 2026." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Fuentes auto-hospedadas vía @font-face en teaser.css (CSP: font-src 'self'). -->
  </head>
  <body>
    <div id="root"></div>
    <!-- Sin JS no hay nada que renderizar (la hoja de estilos también entra por
         el bundle), así que la fecha queda igual de disponible en texto plano. -->
    <noscript>
      <p>Still Louder — <time datetime="2026-10-31">31 de octubre de 2026</time></p>
    </noscript>
    <script type="module" src="/src/teaser/main.tsx"></script>
  </body>
</html>
