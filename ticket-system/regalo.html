<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Still Louder</title>
    <!-- Página oculta: no debe indexarse ni enlazarse desde ningún lado. -->
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#3e2768" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Fuentes auto-hospedadas vía @font-face en theme.css (CSP: font-src 'self'). -->
  </head>
  <body>
    <!-- Filtro SVG de bordes "papel rasgado", reutilizado del flujo público. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="tk-rough">
        <feTurbulence type="fractalNoise" baseFrequency="0.014 0.018" numOctaves="3" seed="7" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/regalo/main.tsx"></script>
  </body>
</html>
